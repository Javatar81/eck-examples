# Fleet Server + Elastic Agent (Kubernetes integration).
# Use with: -f values.yaml -f values-fleet.yaml
# When Fleet Server is enabled, an Elastic Agent DaemonSet is deployed and enrolled via Fleet Server.
# Set fleet.namespace to match the Helm release namespace if not elastic.
#
# Collect Kubernetes audit logs from local files (kubernetes.audit_logs / audit-logs-filestream):
#   --set kubernetesAuditLogs.enabled=true
# Requires the API server to write audit logs under kubernetesAuditLogs.paths (hostPath-mounted).
# See: https://www.elastic.co/docs/reference/integrations/kubernetes/audit-logs
# See: https://www.elastic.co/docs/deploy-manage/deploy/cloud-on-k8s/managing-deployments-using-helm-chart

fleet:
  namespace: elastic

fleetAgentRBAC:
  enabled: true

# Opt-in: Collect Kubernetes audit logs from local files in the Kubernetes integration.
kubernetesAuditLogs:
  enabled: false
  paths:
    - /var/log/kubernetes/kube-apiserver-audit.log

eck-stack:
  # Disabled here; templates/kibana-fleet.yaml renders Kibana so agentPolicies can
  # honor kubernetesAuditLogs.enabled. Hosts/packages below are still consumed by that template.
  eck-kibana:
    enabled: false
    fullnameOverride: kibana
    version: "9.4.2"
    elasticsearchRef:
      name: elasticsearch
    spec:
      count: 1
      config:
        xpack.fleet.agents.elasticsearch.hosts:
          - "https://elasticsearch-es-http.elastic.svc:9200"
        xpack.fleet.agents.fleet_server.hosts:
          - "https://fleet-server-agent-http.elastic.svc:8220"
        xpack.fleet.packages:
          - name: system
            version: latest
          - name: elastic_agent
            version: latest
          - name: fleet_server
            version: latest
          - name: kubernetes
            version: latest
          - name: otlp_input_otel
            version: latest
  eck-fleet-server:
    enabled: true
    fullnameOverride: fleet-server
    serviceAccount: null
    clusterRole: null
    clusterRoleBinding: null
    deployment:
      replicas: 1
      podTemplate:
        spec:
          serviceAccountName: fleet-server
          automountServiceAccountToken: true
    policyID: eck-fleet-server
    kibanaRef:
      name: kibana
    elasticsearchRefs:
      - name: elasticsearch

  eck-agent:
    enabled: true
    fullnameOverride: elastic-agent
    serviceAccount: null
    clusterRole: null
    clusterRoleBinding: null
    policyID: eck-agent
    mode: fleet
    kibanaRef:
      name: kibana
    elasticsearchRefs: []
    fleetServerRef:
      name: fleet-server
    daemonSet:
      podTemplate:
        spec:
          serviceAccountName: elastic-agent
          hostNetwork: true
          dnsPolicy: ClusterFirstWithHostNet
          automountServiceAccountToken: true
          securityContext:
            runAsUser: 0
          # Audit logs are written on control-plane nodes (e.g. kind).
          tolerations:
            - key: node-role.kubernetes.io/control-plane
              operator: Exists
              effect: NoSchedule
          # Mount node logs so audit_logs (and container logs) are readable.
          volumes:
            - name: varlog
              hostPath:
                path: /var/log
          containers:
            - name: agent
              volumeMounts:
                - name: varlog
                  mountPath: /var/log
                  readOnly: true
